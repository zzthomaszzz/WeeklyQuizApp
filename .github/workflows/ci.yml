name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET_KEY: ci-test-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Separate processes: unit-test settings must not leak into the
      # PostgreSQL-backed integration tests. Coverage is accumulated across
      # both runs and the threshold is checked once, on the combined result.
      - run: python -m pytest unit_tests -q --cov=app --cov-report=
      - run: python -m pytest tests -q --cov=app --cov-append --cov-report=term-missing --cov-fail-under=80
